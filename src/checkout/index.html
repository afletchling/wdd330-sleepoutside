<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Sleep Outside | Checkout</title>

    <link rel="stylesheet" href="/css/style.css" />
    <script src="../js/checkout.js" type="module"></script>
  </head>

  <body>
    <header class="divider" id="header"></header>

    <main class="divider">
      <section class="products">
        <h2>Review & Place your Order</h2>
        <form>
          <fieldset>
            <legend>Billing Information</legend>
            <label for="first-name">
            First Name:
            <input name="first-name" autocomplete="given-name" required>
          </label>
          <label for="last-name">
            Last Name:
            <input name="last-name" autocomplete="family-name" required>
          </label>
          <label for="address">
            Street Address:
            <input name="address" autocomplete="street-address" required>
          </label>
          <label for="city">
            City:
            <input name="city" autocomplete="address-level2" required>
          </label>
          <label for="state">
            State:
            <input name="state" autocomplete="address-level1" required>
          </label>
          <label for="zipcode">
            Zip Code:
            <input name="zipcode" id="zipcode" autocomplete="postal-code" required>
          </label>
          </fieldset>
          <fieldset>
            <legend>Payment Information</legend>
            <label for="card">
            Credit Card Number:
            <input name="card" autocomplete="cc-number" maxlength="16" required>
          </label>
          <label for="exp">
            Expiration Date:
            <input name="exp" autocomplete="cc-exp" maxlength="5" required>
          </label>
          <label for="security-code">
            Security Code:
            <input name="security-code" autocomplete="cc-csc" maxlength="4" required>
          </label>
          </fieldset>
          <p id="subtotal">Subtotal: $0.00</p>
          <p class="hidden" id="tax">Tax: $0.00</p>
          <p class="hidden" id="shipping">Shipping: $0.00</p>
          <p class="hidden" id="total">Total: $0.00</p>
          <button type="submit">Submit</button>
        </form>
      </section>
    </main>

    <footer id="footer"></footer>
  </body>
</html>
